name: Build v1.0 Underground Art

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'tools/build_v100_art_overlays.py'
      - 'tools/build_v100_underground_approval.py'
      - 'tools/v100_underground_semantics_audit.py'
      - 'tools/multilevel_map_audit.py'
      - 'mapfiles/data/map_001_gwb_corridor/roads.csv'
      - 'mapfiles/data/map_001_gwb_corridor/road_points.csv'
      - 'mapfiles/data/map_001_gwb_corridor/levels.csv'
      - 'mapfiles/data/map_001_gwb_corridor/level_connectors.csv'
      - 'mapfiles/data/map_001_gwb_corridor/map.csv'
      - '.github/workflows/v100-underground-art.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'tools/build_v100_art_overlays.py'
      - 'tools/build_v100_underground_approval.py'
      - 'tools/v100_underground_semantics_audit.py'
      - 'tools/multilevel_map_audit.py'
      - 'mapfiles/data/map_001_gwb_corridor/roads.csv'
      - 'mapfiles/data/map_001_gwb_corridor/road_points.csv'
      - 'mapfiles/data/map_001_gwb_corridor/levels.csv'
      - 'mapfiles/data/map_001_gwb_corridor/level_connectors.csv'
      - 'mapfiles/data/map_001_gwb_corridor/map.csv'
      - '.github/workflows/v100-underground-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-underground-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install --upgrade pillow

      - name: Audit Underground traversal semantics
        run: python tools/v100_underground_semantics_audit.py

      - name: Re-run general multi-level audit
        run: python tools/multilevel_map_audit.py

      - name: Generate collision-accurate Underground/Night art
        run: python tools/build_v100_underground_approval.py

      - name: Package deterministic Underground/Night composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path('assets/environment/approved/map_001_gwb_corridor/v100_layers/underground/night')
          archive = Path('assets/environment/approved/map_001_gwb_corridor/composition_tiles_v100_underground.zip')
          tiles = sorted(source.glob('tile_*.png'))
          if len(tiles) != 192:
              raise SystemExit(f'Expected 192 Underground/Night tiles, found {len(tiles)}')

          archive.parent.mkdir(parents=True, exist_ok=True)
          fixed_date = (1980, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for tile in tiles:
                  info = zipfile.ZipInfo(f'night/{tile.name}', date_time=fixed_date)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, tile.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=6)
          print(f'Packaged deterministic Underground archive: {archive}')
          PY

      - name: Verify Underground output and map contract
        run: |
          python - <<'PY'
          import csv
          import zipfile
          from pathlib import Path

          root = Path('assets/environment/approved/map_001_gwb_corridor')
          layer = root / 'v100_layers/underground/night'
          assert len(list(layer.glob('tile_*.png'))) == 192
          assert (root / 'v100_layers/UNDERGROUND_NIGHT_APPROVAL_PREVIEW.png').is_file()
          assert (root / 'v100_layers/UNDERGROUND_NIGHT_FOCUS_PREVIEW.png').is_file()

          with Path('mapfiles/data/map_001_gwb_corridor/map.csv').open(encoding='utf-8-sig', newline='') as f:
              cfg = {r['key']: r['value'] for r in csv.DictReader(f)}
          expected = 'assets/environment/approved/map_001_gwb_corridor/composition_tiles_v100_underground.zip'
          assert int(cfg['underground_level_id']) == -1
          assert cfg['underground_composition_archive'] == expected
          assert float(cfg['underground_composition_source_scale']) == 1.0
          assert float(cfg['underground_composition_world_y']) == 0.0
          assert cfg['underground_runtime_wired'].lower() == 'false'

          with zipfile.ZipFile(expected, 'r') as z:
              actual = set(z.namelist())
          names = {f'night/tile_{x:02d}_{y:02d}.png' for x in range(16) for y in range(12)}
          if names - actual:
              raise SystemExit(f'Missing runtime tiles: {sorted(names-actual)[:5]}')
          print('V100_UNDERGROUND_ART_CONTRACT_OK level=-1 archive=192 runtime_wired=false')
          PY

      - name: Upload Underground approval artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v100-underground-night
          path: |
            assets/environment/approved/map_001_gwb_corridor/v100_layers/UNDERGROUND_NIGHT_APPROVAL_PREVIEW.png
            assets/environment/approved/map_001_gwb_corridor/v100_layers/UNDERGROUND_NIGHT_FOCUS_PREVIEW.png
            assets/environment/approved/map_001_gwb_corridor/v100_layers/underground/night/*.png
            assets/environment/approved/map_001_gwb_corridor/composition_tiles_v100_underground.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated Underground/Night review art
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/environment/approved/map_001_gwb_corridor/composition_tiles_v100_underground.zip
          git add -f assets/environment/approved/map_001_gwb_corridor/v100_layers/UNDERGROUND_NIGHT_APPROVAL_PREVIEW.png
          git add -f assets/environment/approved/map_001_gwb_corridor/v100_layers/UNDERGROUND_NIGHT_FOCUS_PREVIEW.png
          if git diff --cached --quiet; then
            echo 'No generated Underground changes to commit.'
          else
            git commit -m 'v1.0: package deterministic Underground/Night art'
            for attempt in 1 2 3; do
              if git push origin HEAD:v1.0-art-overlay; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; rebasing onto latest branch head..."
              git fetch origin v1.0-art-overlay
              git rebase origin/v1.0-art-overlay
            done
            echo 'Unable to publish generated Underground/Night art after 3 attempts.' >&2
            exit 1
          fi
