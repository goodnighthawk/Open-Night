name: Diagnose v1.0 First Floor Runtime

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - '.github/workflows/v100-first-floor-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-first-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade 'pygame-ce==2.5.8' 'Pillow>=10,<13'

      - name: Apply First Floor wiring
        run: python tools/wire_v100_first_floor_runtime_v2.py

      - name: Compile patched runtime
        run: |
          python -m py_compile mapfiles/loader.py common.py server.py client.py interior_layout.py interior_art.py

      - name: Run audit and retain exact result
        shell: bash
        run: |
          set +e
          python tools/v100_first_floor_runtime_audit_v2.py > first_floor_audit.log 2>&1
          status=$?
          echo "AUDIT_EXIT_STATUS=${status}" >> first_floor_audit.log
          mkdir -p art_review
          cp first_floor_audit.log art_review/FIRST_FLOOR_AUDIT_LAST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f art_review/FIRST_FLOOR_AUDIT_LAST.txt
          git commit -m 'qa: record First Floor audit diagnostic' || true
          git push origin HEAD:v1.0-art-overlay
          exit ${status}
