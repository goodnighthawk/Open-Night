name: GWB Map Workbench Preview

on:
  push:
    branches: [map-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gwb-map-previewer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out map-preview
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview dependencies
        run: python -m pip install 'pygame-ce==2.5.8' 'Pillow>=10,<13'

      - name: Rebuild authored GWB preview data and modular art
        run: |
          python tools/build_v4_modular_building_tiles.py
          python dev_tools/map_generator/tools/build_v4_approved_sprite_layout.py

      - name: Verify catalogs, transparency, geometry, and interactions
        run: |
          python -m py_compile map_workbench.py tools/package_gwb_map_previewer.py
          python tools/v4_map_workbench_audit.py
          python tools/next_map_generated_art_audit.py
          python tools/next_map_transition_audit.py
          python tools/next_map_surface_audit.py

      - name: Render complete Ground and Roof maps
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python map_workbench.py --mode layout --layer ground --size 2730x1500 --map-only --screenshot artifacts/map_workbench/gwb_full_updated_map.png
          python map_workbench.py --mode layout --layer roof --size 2730x1500 --map-only --screenshot artifacts/map_workbench/gwb_full_updated_roof.png

      - name: Assemble portable previewer
        run: python tools/package_gwb_map_previewer.py --output build/gwb_map_previewer

      - name: Smoke-test the packaged previewer
        working-directory: build/gwb_map_previewer
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python map_workbench.py --mode layout --layer ground --size 1440x900 --map-only --screenshot packaged_smoke.png

      - name: Upload downloadable GWB map previewer
        uses: actions/upload-artifact@v4
        with:
          name: open-night-gwb-map-previewer
          path: build/gwb_map_previewer
          if-no-files-found: error
          retention-days: 30
