name: Wire v1.0 First Floor Runtime

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'interior_layout.py'
      - 'interior_art.py'
      - 'tools/wire_v100_first_floor_runtime.py'
      - 'tools/wire_v100_first_floor_runtime_v2.py'
      - 'tools/v100_first_floor_runtime_audit.py'
      - 'tools/v100_first_floor_runtime_audit_v2.py'
      - '.github/workflows/v100-first-floor-runtime.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'interior_layout.py'
      - 'interior_art.py'
      - 'tools/wire_v100_first_floor_runtime.py'
      - 'tools/wire_v100_first_floor_runtime_v2.py'
      - 'tools/v100_first_floor_runtime_audit.py'
      - 'tools/v100_first_floor_runtime_audit_v2.py'
      - '.github/workflows/v100-first-floor-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-first-floor-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art-overlay branch
        uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless renderer dependencies
        run: python -m pip install --upgrade 'pygame-ce==2.5.8' 'Pillow>=10,<13'

      - name: Apply exact-anchor First Floor wiring
        run: python tools/wire_v100_first_floor_runtime_v2.py

      - name: Compile patched runtime
        run: |
          python -m py_compile mapfiles/loader.py common.py server.py client.py
          python -m py_compile interior_layout.py interior_art.py
          python -m py_compile tools/wire_v100_first_floor_runtime.py tools/wire_v100_first_floor_runtime_v2.py tools/v100_first_floor_runtime_audit.py tools/v100_first_floor_runtime_audit_v2.py

      - name: Audit world registration and player-scale rendering
        run: python tools/v100_first_floor_runtime_audit_v2.py

      - name: Verify approval artifacts
        run: |
          test -f assets/environment/approved/map_001_gwb_corridor/v100_layers/FIRST_FLOOR_PLAYER_SCALE_PREVIEW.png
          test -f assets/environment/approved/map_001_gwb_corridor/v100_layers/first_floor/night/starter_apartment_1280x720.png

      - name: Upload First Floor approval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v100-first-floor-runtime
          path: |
            assets/environment/approved/map_001_gwb_corridor/v100_layers/FIRST_FLOOR_PLAYER_SCALE_PREVIEW.png
            assets/environment/approved/map_001_gwb_corridor/v100_layers/first_floor/night/starter_apartment_1280x720.png
          if-no-files-found: error
          retention-days: 30

      - name: Confirm wiring patch is idempotent
        run: |
          first="$(git diff -- mapfiles/loader.py common.py server.py client.py mapfiles/data/map_001_gwb_corridor/map.csv | sha256sum | cut -d' ' -f1)"
          python tools/wire_v100_first_floor_runtime_v2.py
          second="$(git diff -- mapfiles/loader.py common.py server.py client.py mapfiles/data/map_001_gwb_corridor/map.csv | sha256sum | cut -d' ' -f1)"
          test "$first" = "$second"

      - name: Commit audited First Floor runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapfiles/loader.py
          git add common.py
          git add server.py
          git add client.py
          git add mapfiles/data/map_001_gwb_corridor/map.csv
          if git diff --cached --quiet; then
            echo 'First Floor runtime integration is already applied.'
          else
            git commit -m 'v1.0: wire world-registered First Floor runtime'
            for attempt in 1 2 3; do
              if git push origin HEAD:v1.0-art-overlay; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; rebasing onto latest branch head..."
              git fetch origin v1.0-art-overlay
              git rebase origin/v1.0-art-overlay
            done
            echo 'Unable to publish audited First Floor runtime integration after 3 attempts.' >&2
            exit 1
          fi
