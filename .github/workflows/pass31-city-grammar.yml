name: Open Night Pass 31 City Grammar

on:
  push:
    branches: [main]
    paths:
      - 'config/city_art_rules.csv'
      - 'dev_tools/map_generator/tools/city_art_grammar.py'
      - 'dev_tools/map_generator/tools/build_pass31_city_grammar.py'
      - 'dev_tools/map_generator/tools/build_pass31_city_grammar_v2.py'
      - 'tools/pass31_city_grammar_audit.py'
      - '.github/workflows/pass31-city-grammar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pass31-city-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Build protected Pass 26 RC4 base
        run: python dev_tools/map_generator/tools/build_pass26_art_first_world_v4.py
      - name: Preserve approved-core art gates
        run: |
          python tools/pass20_frontage_audit.py --strict
          python tools/building_component_scale_audit.py --strict
          python tools/building_modular_detail_audit.py --strict
          python tools/building_massing_convergence_audit.py --strict
          python tools/street_detail_density_audit.py --strict
          python tools/landmark_pass24_audit.py --strict
          python tools/art_first_world_audit.py --strict

      - name: Apply protected Pass 27 open blocks
        run: python dev_tools/map_generator/tools/build_pass27_from_pass26.py
      - name: Preserve Pass 27 open-block gate
        run: python tools/pass27_open_block_audit.py --strict
      - name: Apply protected Pass 28 sidewalk continuity
        run: python dev_tools/map_generator/tools/build_pass28_sidewalk_continuity_v2.py
      - name: Preserve Pass 28 sidewalk gate
        run: python tools/pass28_sidewalk_continuity_audit_v2.py --strict

      # Pass 31 invokes Pass 30, which invokes the Pass 29 doubled-world build.
      # Starting it directly from the protected 8192x4096 Pass-28 master avoids
      # feeding a previously doubled 16384x8192 master back into Pass 29.
      - name: Build Pass 31 city-grammar candidate
        run: python dev_tools/map_generator/tools/build_pass31_city_grammar_v2.py
      - name: Verify inherited doubled-world geometry
        run: python tools/pass29_double_world_audit.py --strict
      - name: Verify inherited seam convergence
        run: python tools/pass30_extension_convergence_audit.py --strict
      - name: Run Pass 31 city-grammar gate
        run: python tools/pass31_city_grammar_audit.py --strict

      - name: Verify Pass 31 review contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=dev_tools/map_generator/profiles/gwb_gameplay/unified_composition
          test -f "$OUT/unified_composition_day.png"
          test -f "$OUT/unified_composition_night.png"
          test -f "$OUT/semantic/pass31_city_grammar_assignments.csv"
          grep -q 'pass_31_city_grammar_rc1' "$OUT/composition_manifest.csv"
          grep -q 'approved_core_v1' "$OUT/composition_manifest.csv"
          grep -q 'config/city_art_rules.csv' "$OUT/composition_manifest.csv"

      - name: Upload Pass 31 review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-night-pass31-city-grammar-review
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa/pass31_screenshots/*.png
            config/city_art_rules.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_buildings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass31_city_grammar_assignments.csv
