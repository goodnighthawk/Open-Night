name: Build v1.0 Ground Art PR

on:
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'tools/build_v100_art_overlays.py'
      - 'tools/build_v100_ground_approval.py'
      - 'mapfiles/data/map_001_gwb_corridor/**'
      - '.github/workflows/v100-ground-art.yml'

permissions:
  contents: read

jobs:
  build-ground-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install --upgrade pillow

      - name: Generate collision-accurate Ground/Night art
        run: python tools/build_v100_ground_approval.py

      - name: Verify output
        run: |
          test -f assets/environment/approved/map_001_gwb_corridor/v100_layers/GROUND_NIGHT_APPROVAL_PREVIEW.png
          test "$(find assets/environment/approved/map_001_gwb_corridor/v100_layers/ground/night -name 'tile_*.png' | wc -l)" -eq 192

      - name: Upload approval artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v100-ground-night
          path: |
            assets/environment/approved/map_001_gwb_corridor/v100_layers/GROUND_NIGHT_APPROVAL_PREVIEW.png
            assets/environment/approved/map_001_gwb_corridor/v100_layers/ground/night/*.png
          if-no-files-found: error
          retention-days: 30
