name: Open Night v0.9.0 Map Release Candidate

on:
  push:
    branches: [main]
    paths:
      - 'dev_tools/map_generator/**'
      - 'mapfiles/**'
      - 'assets/environment/**'
      - 'BUILD_UNIFIED_MAP_COMPOSITION.bat'
      - '.github/workflows/v090-map-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v090-map-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map renderer dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Build balanced v0.9.0 release candidate
        run: python dev_tools/map_generator/tools/build_v090_release_candidate.py

      - name: Verify release-candidate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/unified_composition_day.png
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/unified_composition_night.png
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_buildings.csv
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_vegetation.csv
          test -f dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_frontage_dressing.csv
          grep -q 'art_convergence_pass_19b_frontage_balanced' dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path('dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic')
          def rows(name):
              with (root / name).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          buildings = rows('iterated_buildings.csv')
          vegetation = rows('iterated_vegetation.csv')
          frontage = rows('iterated_frontage_dressing.csv')
          scales = rows('building_sprite_scale_audit.csv')
          park = [r for r in vegetation if r.get('placement_rule') == 'retained_park_canopy_pass19_v2']
          obvious = [r for r in frontage if r.get('kind') not in {'frontage_wear', 'litter_cluster'}]
          dressed = {r.get('building_id') for r in obvious}
          by_building = {}
          for row in obvious:
              by_building.setdefault(row.get('building_id'), 0)
              by_building[row.get('building_id')] += 1
          cluttered = {bid for bid, count in by_building.items() if count >= 4}
          assert len(buildings) == 95, f'expected 95 buildings, got {len(buildings)}'
          assert all(r.get('status') == 'pass' for r in scales), 'building scale audit contains failures'
          assert len(park) >= 20, f'park canopy unexpectedly sparse: {len(park)} trees'
          assert 29 <= len(dressed) <= 48, f'dressed facades outside 30-50% target: {len(dressed)}'
          assert 10 <= len(cluttered) <= 19, f'cluttered facades outside 10-20% target: {len(cluttered)}'
          assert len(frontage) >= 190, f'frontage layer unexpectedly sparse: {len(frontage)} rows'
          print(f'V090_RC_GATE buildings={len(buildings)} vegetation={len(vegetation)} park_trees={len(park)} frontage_rows={len(frontage)} dressed_facades={len(dressed)} cluttered_facades={len(cluttered)} scale_failures=0')
          PY

      - name: Upload v0.9.0 visual-review bundle
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v0.9.0-balanced-visual-review
          if-no-files-found: error
          retention-days: 14
          path: |
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/unified_composition_day.png
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/unified_composition_night.png
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_buildings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_vegetation.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/iterated_frontage_dressing.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/building_sprite_scale_audit.csv
