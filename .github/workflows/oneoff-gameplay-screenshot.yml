name: One-off in-game screenshot

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - '.github/workflows/oneoff-gameplay-screenshot.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - '.github/workflows/oneoff-gameplay-screenshot.yml'
  workflow_dispatch:

jobs:
  capture-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade 'pygame-ce==2.5.8' 'websockets>=16.0,<18' 'mysql-connector-python>=9.0,<10' 'Pillow>=10.0,<13'
      - name: Launch real local server and capture connected client frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gameplay
          python -u server.py --memory-db --no-discovery --port 8765 --map map_001_gwb_corridor --traffic 8 > artifacts/gameplay/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          if ! python - <<'PY'
          import socket, time
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              with socket.socket() as s:
                  s.settimeout(0.2)
                  if s.connect_ex(('127.0.0.1', 8765)) == 0:
                      print('SERVER_READY')
                      break
              time.sleep(0.1)
          else:
              raise SystemExit(1)
          PY
          then
            echo '--- server.log ---'
            cat artifacts/gameplay/server.log || true
            exit 1
          fi
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python - <<'PY'
          import asyncio
          import sys
          import time
          from pathlib import Path

          import pygame
          import client

          output = Path('artifacts/gameplay/OPEN_NIGHT_INGAME_1280x720.png')
          holder = {}
          state = {'connected_frames': 0, 'saved': False, 'started': time.monotonic()}

          original_game_init = client.Game.__init__
          def capture_game_init(self, *args, **kwargs):
              original_game_init(self, *args, **kwargs)
              holder['game'] = self
          client.Game.__init__ = capture_game_init

          original_flip = pygame.display.flip
          def capture_flip():
              original_flip()
              game = holder.get('game')
              if game is not None and getattr(game, 'local_id', None):
                  state['connected_frames'] += 1
                  if state['connected_frames'] >= 45 and not state['saved']:
                      pygame.image.save(pygame.display.get_surface(), output)
                      state['saved'] = True
                      pygame.event.post(pygame.event.Event(pygame.QUIT))
              if time.monotonic() - state['started'] > 15 and not state['saved']:
                  pygame.image.save(pygame.display.get_surface(), output)
                  state['saved'] = True
                  pygame.event.post(pygame.event.Event(pygame.QUIT))
          pygame.display.flip = capture_flip

          sys.argv = [
              'client.py', '--server', 'ws://127.0.0.1:8765',
              '--name', 'StaticStyleReview', '--phone', '5550000111',
          ]
          asyncio.run(client.main())

          game = holder.get('game')
          assert output.exists(), 'client never produced a framebuffer capture'
          assert game is not None and getattr(game, 'local_id', None), 'capture was not a connected in-game frame'
          print('INGAME_CAPTURE_OK', output, 'local_id=', game.local_id, 'frames_after_connect=', state['connected_frames'])
          PY
      - name: Upload in-game screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-night-oneoff-ingame-screenshot
          path: |
            artifacts/gameplay/OPEN_NIGHT_INGAME_1280x720.png
            artifacts/gameplay/server.log
          if-no-files-found: warn
          retention-days: 7
