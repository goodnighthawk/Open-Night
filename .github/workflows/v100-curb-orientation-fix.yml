name: Apply v1.0 curb orientation fix

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - '.github/workflows/v100-curb-orientation-fix.yml'

permissions:
  contents: write

jobs:
  apply-curb-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
      - name: Correct all curb world-to-pack mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('grid_world.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('CURB_WORLD_TO_PACK_IMAGE = {')
          end = text.index('\n}\n', start) + 3
          mapping = '''CURB_WORLD_TO_PACK_IMAGE = {
    # Horizontal curb centers: logical top/bottom describe the world edge of
    # the sidewalk block, while the pack filename names the pavement-facing side.
    "curb_top": "city_block://road_and_pavement_tileset/curb_bottom_center.png",
    "curb_bottom": "city_block://road_and_pavement_tileset/curb_top_center.png",

    # Vertical road edges are mirrored in the same way: a logical right edge
    # sits LEFT of the road (pavement left / asphalt right), and vice versa.
    "curb_left": "city_block://road_and_pavement_tileset/curb_right_edge.png",
    "curb_right": "city_block://road_and_pavement_tileset/curb_left_edge.png",

    # Corner names are world/block semantics. Select the pack sprite by where
    # its pavement quarter actually appears, verified against example.png.
    "curb_tl_outer": "city_block://road_and_pavement_tileset/curb_top_right_outer.png",
    "curb_tr_outer": "city_block://road_and_pavement_tileset/curb_top_left_outer.png",
    "curb_bl_outer": "city_block://road_and_pavement_tileset/curb_bottom_right_outer.png",
    "curb_br_outer": "city_block://road_and_pavement_tileset/curb_bottom_left_outer.png",
}
'''
          text = text[:start] + mapping + text[end:]
          text = text.replace(
              '# edge. The supplied reference art shows the vertical convention is opposite\n# to the first-pass mapping, so translate top<->bottom once at catalog load.',
              '# edge. The supplied example.png and raw sprites are the orientation authority;\n# translate all four edges and four outer corners once at catalog load.'
          )
          text = text.replace(
              '# semantics (top/bottom), and no individual curb sprite is rotated.',
              '# semantics, and no individual curb sprite is rotated.'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile grid_world.py
      - name: Commit curb mapping
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add grid_world.py
          git diff --cached --quiet && exit 0
          git commit -m 'v1.0: correct side and corner curb sprite mapping'
          git push origin HEAD:v1.0-art-overlay
