name: v1.0 Art Overlay RC

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'config/art_overlay_layers.csv'
      - 'tools/build_v100_art_overlays.py'
      - 'tools/v100_art_overlay_audit.py'
      - 'mapfiles/data/map_001_gwb_corridor/**'
      - 'assets/core_city_pack/**'
      - 'assets/environment/approved/**'
      - '.github/workflows/v100-art-overlay.yml'
  workflow_dispatch:

jobs:
  build-art-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art build dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate eight collision-locked overlay layers
        run: python tools/build_v100_art_overlays.py
      - name: Audit registration and tile completeness
        run: python tools/v100_art_overlay_audit.py
      - name: Preserve generated overlay candidate
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v1.0-art-overlays
          path: assets/environment/approved/map_001_gwb_corridor/v100_layers/
          if-no-files-found: error
