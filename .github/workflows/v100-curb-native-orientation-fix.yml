name: Apply corrected curb orientation

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - '.github/workflows/v100-curb-native-orientation-fix.yml'

permissions:
  contents: write

jobs:
  fix-curbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
          fetch-depth: 0
      - name: Restore filename-driven horizontal and corner orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('grid_world.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('CURB_WORLD_TO_PACK_IMAGE = {')
          end = text.index('\n}\n', start) + 3
          mapping = '''CURB_WORLD_TO_PACK_IMAGE = {
    # Keep the pack orientation literal. example.png is the visual authority.
    # The vertical left/right tiles were already correct; top/bottom and all
    # four outer corners are restored to their filename orientation here.
    "curb_left": "city_block://road_and_pavement_tileset/curb_left_edge.png",
    "curb_right": "city_block://road_and_pavement_tileset/curb_right_edge.png",
    "curb_top": "city_block://road_and_pavement_tileset/curb_top_center.png",
    "curb_bottom": "city_block://road_and_pavement_tileset/curb_bottom_center.png",
    "curb_tl_outer": "city_block://road_and_pavement_tileset/curb_top_left_outer.png",
    "curb_tr_outer": "city_block://road_and_pavement_tileset/curb_top_right_outer.png",
    "curb_bl_outer": "city_block://road_and_pavement_tileset/curb_bottom_left_outer.png",
    "curb_br_outer": "city_block://road_and_pavement_tileset/curb_bottom_right_outer.png",
}
'''
          text = text[:start] + mapping + text[end:]
          text = text.replace(
              '# The city_block curb filenames describe the edge from the pavement sprite\'s\n# own frame, while Open Night\'s logical curb IDs describe the visible world\n# edge. The supplied reference art shows the vertical convention is opposite\n# to the first-pass mapping, so translate top<->bottom once at catalog load.',
              '# Curb orientation follows the supplied city_block filenames directly.\n# example.png is the visual reference; no curb tile is rotated at runtime.'
          )
          text = text.replace(
              '# Centralized orientation correction: map authors continue to use world\n        # semantics (top/bottom), and no individual curb sprite is rotated.',
              '# Centralized filename-driven curb mapping; no individual curb sprite is rotated.'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile grid_world.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add grid_world.py
          git commit -m 'v1.0: restore horizontal and corner curb filename orientation'
          git push origin HEAD:v1.0-art-overlay
