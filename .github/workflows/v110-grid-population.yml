name: Build v1.1 Grid Population Runtime

on:
  push:
    branches: [v1.1-bug-review]
    paths:
      - 'server.py'
      - 'client.py'
      - 'v100_server.py'
      - 'v100_client.py'
      - 'v110_grid_population.py'
      - 'v110_pedestrian_flow.py'
      - 'v110_pedestrian_connectivity.py'
      - 'v110_vehicle_proportions.py'
      - 'v110_traffic_recovery.py'
      - 'v100_runtime_refinement.py'
      - 'v100_safe_layout.py'
      - 'v100_scale_normalization.py'
      - 'grid_world.py'
      - 'grid_runtime.py'
      - 'grid_renderer.py'
      - 'mapfiles/data/map_001_gwb_corridor/grid_v100/**'
      - 'tools/capture_v110_grid_population.py'
      - 'tools/audit_v110_traffic_recovery.py'
      - '.github/workflows/v110-grid-population.yml'
  pull_request:
    branches: [v1.0-art-overlay]
    paths:
      - 'server.py'
      - 'client.py'
      - 'v100_server.py'
      - 'v100_client.py'
      - 'v110_grid_population.py'
      - 'v110_pedestrian_flow.py'
      - 'v110_pedestrian_connectivity.py'
      - 'v110_vehicle_proportions.py'
      - 'v110_traffic_recovery.py'
      - 'v100_runtime_refinement.py'
      - 'v100_safe_layout.py'
      - 'v100_scale_normalization.py'
      - 'grid_world.py'
      - 'grid_runtime.py'
      - 'grid_renderer.py'
      - 'mapfiles/data/map_001_gwb_corridor/grid_v100/**'
      - 'tools/capture_v110_grid_population.py'
      - 'tools/audit_v110_traffic_recovery.py'
      - '.github/workflows/v110-grid-population.yml'
  workflow_dispatch:

jobs:
  grid-population-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade 'pygame-ce==2.5.8' 'websockets>=16,<18' 'mysql-connector-python>=9,<10' 'Pillow>=10,<13'
      - name: Compile v1.1 population runtime
        run: python -m py_compile v100_server.py v100_client.py v110_grid_population.py v110_pedestrian_flow.py v110_pedestrian_connectivity.py v110_vehicle_proportions.py v110_traffic_recovery.py server.py client.py grid_world.py grid_runtime.py tools/capture_v110_grid_population.py tools/audit_v110_traffic_recovery.py
      - name: Render and exercise GridWorld-native traffic + pedestrians
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/capture_v110_grid_population.py
      - name: Run sustained traffic deadlock audit
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/audit_v110_traffic_recovery.py
      - name: Verify v1.1 population proof bundle
        run: |
          test -f assets/grid_v100/V110_POPULATION_RUNTIME_PROOF_1280x720.png
          test -f assets/grid_v100/V110_FULL_STACK_RUNTIME_REVIEW_2560x1440.png
          test -f assets/grid_v100/V110_GRID_POPULATION_RUNTIME_AUDIT.json
          test -f assets/grid_v100/V110_TRAFFIC_RECOVERY_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('assets/grid_v100/V110_GRID_POPULATION_RUNTIME_AUDIT.json').read_text())
          traffic = json.loads(Path('assets/grid_v100/V110_TRAFFIC_RECOVERY_AUDIT.json').read_text())
          assert audit['traffic_spawned'] >= 6, audit
          assert audit['pedestrians_spawned'] >= 12, audit
          assert audit['traffic_moved_after_2_5s'] >= 3, audit
          assert audit['npcs_moved_after_2_5s'] >= 8, audit
          assert audit['pedestrian_reciprocal_edge_count'] == 0, audit
          assert audit['pedestrian_one_way_cycle_routes'] == audit['pedestrian_route_count'], audit
          assert audit['pedestrians_stalled_after_warmup_count'] <= max(2, audit['pedestrians_spawned'] // 20), audit
          assert not audit['pedestrians_off_pavement'], audit
          # v1.1 must be one useful city-scale pedestrian graph rather than
          # isolated local pavement loops around individual buildings.
          assert audit['pedestrian_crosswalk_count'] >= 48, audit
          assert audit['pedestrian_intersection_crosswalk_count'] >= 32, audit
          assert audit['pedestrian_midblock_crosswalk_count'] >= 8, audit
          assert audit['pedestrian_sidewalk_apron_count'] >= 16, audit
          assert audit['pedestrian_connected_route_count'] >= 12, audit
          assert audit['pedestrian_multiblock_route_count'] >= 6, audit
          assert audit['pedestrian_crosswalk_route_count'] >= 6, audit
          assert audit['pedestrian_route_network_components'] == 1, audit
          assert not audit['blocked_traffic_after_10s'], audit
          assert audit['grid_cell_px'] == 128, audit
          # Full-size v1.1 street proportion: a normal car must be at least 2.5x
          # the ~58 px Ground player height. Never regress to the old ~83 px toy car.
          assert audit['vehicle_client_target_length_min_px'] >= 145.0, audit
          assert audit['vehicle_collision_to_visual_ratio_min'] >= 0.78, audit
          assert traffic['simulation_seconds'] >= 60, traffic
          assert not traffic['stalled_car_ids'], traffic
          assert not traffic['undertravel_car_ids'], traffic
          assert not traffic['blocked_car_ids'], traffic
          assert not traffic['overlap_pairs'], traffic
          assert traffic['max_stationary_observed_seconds'] <= traffic['max_stationary_allowed_seconds'], traffic
          assert traffic['lane_offsets_px'] and min(abs(float(v)) for v in traffic['lane_offsets_px']) >= 44.0, traffic
          print(json.dumps({'population': audit, 'traffic_recovery': traffic}, indent=2, sort_keys=True))
          PY
      - name: Upload v1.1 full-stack population proof
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v110-grid-population-runtime
          path: |
            assets/grid_v100/V110_POPULATION_RUNTIME_PROOF_1280x720.png
            assets/grid_v100/V110_FULL_STACK_RUNTIME_REVIEW_2560x1440.png
            assets/grid_v100/V110_GRID_POPULATION_RUNTIME_AUDIT.json
            assets/grid_v100/V110_TRAFFIC_RECOVERY_AUDIT.json
          if-no-files-found: error
          retention-days: 30
