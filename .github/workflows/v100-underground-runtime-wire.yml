name: Wire v1.0 Underground Runtime

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'tools/wire_v100_underground_runtime.py'
      - 'tools/wire_v100_underground_runtime_v2.py'
      - 'tools/v100_underground_runtime_audit.py'
      - '.github/workflows/v100-underground-runtime-wire.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'tools/wire_v100_underground_runtime.py'
      - 'tools/wire_v100_underground_runtime_v2.py'
      - 'tools/v100_underground_runtime_audit.py'
      - '.github/workflows/v100-underground-runtime-wire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-underground-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art-overlay branch
        uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless renderer dependencies
        run: python -m pip install --upgrade 'pygame-ce==2.5.8' 'Pillow>=10,<13'

      - name: Apply exact-anchor runtime wiring
        run: python tools/wire_v100_underground_runtime_v2.py

      - name: Compile patched runtime
        run: |
          python -m py_compile environment_art.py client.py
          python -m py_compile tools/wire_v100_underground_runtime.py tools/wire_v100_underground_runtime_v2.py tools/v100_underground_runtime_audit.py

      - name: Audit Ground/Underground runtime switching
        run: python tools/v100_underground_runtime_audit.py

      - name: Confirm patch is idempotent
        run: |
          first="$(git diff -- environment_art.py client.py mapfiles/data/map_001_gwb_corridor/map.csv | sha256sum | cut -d' ' -f1)"
          python tools/wire_v100_underground_runtime_v2.py
          second="$(git diff -- environment_art.py client.py mapfiles/data/map_001_gwb_corridor/map.csv | sha256sum | cut -d' ' -f1)"
          test "$first" = "$second"

      - name: Commit audited runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add environment_art.py
          git add client.py
          git add mapfiles/data/map_001_gwb_corridor/map.csv
          if git diff --cached --quiet; then
            echo 'Underground runtime integration is already applied.'
          else
            git commit -m 'v1.0: wire Underground/Night into runtime level switching'
            for attempt in 1 2 3; do
              if git push origin HEAD:v1.0-art-overlay; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; rebasing onto latest branch head..."
              git fetch origin v1.0-art-overlay
              git rebase origin/v1.0-art-overlay
            done
            echo 'Unable to publish audited Underground runtime integration after 3 attempts.' >&2
            exit 1
          fi
