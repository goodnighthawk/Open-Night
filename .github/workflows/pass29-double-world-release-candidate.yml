name: Open Night Pass 29 Double World Release Candidate

on:
  push:
    branches: [main]
    paths:
      - 'dev_tools/map_generator/tools/build_pass29_double_world.py'
      - 'dev_tools/map_generator/tools/build_pass29_double_world_v2.py'
      - 'tools/pass29_double_world_audit.py'
      - '.github/workflows/pass29-double-world-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pass29-double-world:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Build protected Pass 26 RC4 base
        run: python dev_tools/map_generator/tools/build_pass26_art_first_world_v4.py
      - name: Preserve component and massing scale gates
        run: |
          python tools/pass20_frontage_audit.py --strict
          python tools/building_component_scale_audit.py --strict
          python tools/building_modular_detail_audit.py --strict
          python tools/building_massing_convergence_audit.py --strict
      - name: Preserve street and landmark art gates
        run: |
          python tools/street_detail_density_audit.py --strict
          python tools/landmark_pass24_audit.py --strict
          python tools/art_first_world_audit.py --strict

      - name: Apply protected Pass 27 intentional open blocks
        run: python dev_tools/map_generator/tools/build_pass27_from_pass26.py
      - name: Preserve Pass 27 open-block gate
        run: python tools/pass27_open_block_audit.py --strict
      - name: Apply protected Pass 28 sidewalk continuity
        run: python dev_tools/map_generator/tools/build_pass28_sidewalk_continuity.py
      - name: Preserve Pass 28 sidewalk gate
        run: python tools/pass28_sidewalk_continuity_audit.py --strict

      - name: Build Pass 29 doubled world with fixed component scale
        run: python dev_tools/map_generator/tools/build_pass29_double_world_v2.py
      - name: Run Pass 29 doubled-world gate
        run: python tools/pass29_double_world_audit.py --strict

      - name: Verify Pass 29 review contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=dev_tools/map_generator/profiles/gwb_gameplay/unified_composition
          test -f "$OUT/unified_composition_day.png"
          test -f "$OUT/unified_composition_night.png"
          test -f "$OUT/semantic/pass29_extension_buildings.csv"
          test -f "$OUT/semantic/pass29_extension_roads.csv"
          test -f "$OUT/semantic/pass29_extension_crossings.csv"
          test -f "$OUT/semantic/pass29_extension_open_blocks.csv"
          test -f "$OUT/gameplay_masks/solid_mask_master.png"
          test -f "$OUT/gameplay_masks/walkable_mask_master.png"
          test -f "$OUT/gameplay_masks/cycle_mask_master.png"
          test -f "$OUT/gameplay_masks/collision_mask_master.png"
          grep -q 'pass_29_double_world_rc1' "$OUT/composition_manifest.csv"

      - name: Upload Pass 29 doubled-world review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-night-pass29-double-world-review
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa/pass29_screenshots/*.png
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_buildings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_roads.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_crossings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_open_blocks.csv
