name: Build v1.0 Grid Runtime Proof

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'grid_world.py'
      - 'grid_renderer.py'
      - 'tools/build_v100_grid_seed.py'
      - 'tools/capture_v100_grid_runtime.py'
      - 'assets/grid_v100/**'
      - '.github/workflows/v100-grid-runtime-proof.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'grid_world.py'
      - 'grid_renderer.py'
      - 'tools/build_v100_grid_seed.py'
      - 'tools/capture_v100_grid_runtime.py'
      - 'assets/grid_v100/**'
      - '.github/workflows/v100-grid-runtime-proof.yml'
  workflow_dispatch:

jobs:
  grid-runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --upgrade 'pygame-ce==2.5.8'
      - name: Compile grid runtime
        run: python -m py_compile grid_world.py grid_renderer.py tools/build_v100_grid_seed.py tools/capture_v100_grid_runtime.py
      - name: Render grid-native proof
        run: python tools/capture_v100_grid_runtime.py
      - name: Upload grid proof
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v100-grid-runtime-proof
          path: assets/grid_v100/GRID_RUNTIME_PROOF_2560x1440.png
          if-no-files-found: error
          retention-days: 30
