name: Build v1.0 Grid Runtime Proof

on:
  push:
    branches: [v1.0-art-overlay]
    paths:
      - 'grid_world.py'
      - 'grid_renderer.py'
      - 'grid_runtime.py'
      - 'mapfiles/data/map_001_gwb_corridor/grid_v100/**'
      - 'tools/build_v100_grid_seed.py'
      - 'tools/capture_v100_grid_runtime.py'
      - 'assets/grid_v100/**'
      - '.github/workflows/v100-grid-runtime-proof.yml'
  pull_request:
    branches: [v0.9.0-consolidation]
    paths:
      - 'grid_world.py'
      - 'grid_renderer.py'
      - 'grid_runtime.py'
      - 'mapfiles/data/map_001_gwb_corridor/grid_v100/**'
      - 'tools/build_v100_grid_seed.py'
      - 'tools/capture_v100_grid_runtime.py'
      - 'assets/grid_v100/**'
      - '.github/workflows/v100-grid-runtime-proof.yml'
  workflow_dispatch:

jobs:
  grid-runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0-art-overlay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --upgrade 'pygame-ce==2.5.8'
      - name: Compile grid runtime
        run: python -m py_compile grid_world.py grid_renderer.py grid_runtime.py tools/build_v100_grid_seed.py tools/capture_v100_grid_runtime.py
      - name: Validate committed playable map
        run: python tools/build_v100_grid_seed.py
      - name: Detect optional city_block source pack
        id: pack
        shell: bash
        run: |
          if [ -f city_block.zip ] || [ -f assets/grid_v100/city_block.zip ] || [ -f assets/source_packs/city_block.zip ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'city_block.zip available: running real Pygame render proof.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'CITY_BLOCK_SOURCE_PACK_EXTERNAL: structural/runtime audit passes without redistributing the user-supplied art pack.'
          fi
      - name: Render real grid-native proof
        if: steps.pack.outputs.available == 'true'
        run: python tools/capture_v100_grid_runtime.py
      - name: Upload grid proof
        if: steps.pack.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: open-night-v100-grid-runtime-proof
          path: assets/grid_v100/GRID_RUNTIME_PROOF_2560x1440.png
          if-no-files-found: error
          retention-days: 30
