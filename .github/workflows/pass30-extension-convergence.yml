name: Open Night Pass 30 Extension Convergence

on:
  push:
    branches: [main]
    paths:
      - 'dev_tools/map_generator/tools/build_pass30_extension_convergence.py'
      - 'dev_tools/map_generator/tools/build_pass30_extension_convergence_v2.py'
      - 'tools/pass30_extension_convergence_audit.py'
      - '.github/workflows/pass30-extension-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pass30-extension-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Build protected Pass 26 RC4 base
        run: python dev_tools/map_generator/tools/build_pass26_art_first_world_v4.py
      - name: Preserve component, massing, detail and landmark gates
        run: |
          python tools/pass20_frontage_audit.py --strict
          python tools/building_component_scale_audit.py --strict
          python tools/building_modular_detail_audit.py --strict
          python tools/building_massing_convergence_audit.py --strict
          python tools/street_detail_density_audit.py --strict
          python tools/landmark_pass24_audit.py --strict
          python tools/art_first_world_audit.py --strict

      - name: Apply protected Pass 27 open blocks
        run: python dev_tools/map_generator/tools/build_pass27_from_pass26.py
      - name: Preserve Pass 27 open-block gate
        run: python tools/pass27_open_block_audit.py --strict
      - name: Apply protected Pass 28 sidewalk continuity
        run: python dev_tools/map_generator/tools/build_pass28_sidewalk_continuity_v2.py
      - name: Preserve Pass 28 sidewalk gate
        run: python tools/pass28_sidewalk_continuity_audit_v2.py --strict

      - name: Build validated Pass 29 doubled-world baseline
        run: python dev_tools/map_generator/tools/build_pass29_double_world_v3.py
      - name: Preserve Pass 29 doubled-world gate
        run: python tools/pass29_double_world_audit.py --strict

      - name: Build Pass 30 extension convergence
        run: python dev_tools/map_generator/tools/build_pass30_extension_convergence_v2.py
      - name: Run Pass 30 convergence gate
        run: python tools/pass30_extension_convergence_audit.py --strict

      - name: Verify Pass 30 review contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=dev_tools/map_generator/profiles/gwb_gameplay/unified_composition
          test -f "$OUT/unified_composition_day.png"
          test -f "$OUT/unified_composition_night.png"
          test -f "$OUT/semantic/pass30_transition_buildings.csv"
          test -f "$OUT/semantic/pass30_extension_building_layers.csv"
          test -f "$OUT/semantic/pass30_extension_stairwells.csv"
          grep -q 'pass_30_extension_convergence_rc1' "$OUT/composition_manifest.csv"
          grep -q 'protected_core_sample' "$OUT/composition_manifest.csv"
          grep -q 'road_safe_core_edge_streetwall_belt_v1' "$OUT/composition_manifest.csv"

      - name: Upload Pass 30 review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-night-pass30-extension-convergence-review
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa/pass30_screenshots/*.png
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/composition_manifest.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass29_extension_buildings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass30_transition_buildings.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass30_extension_building_layers.csv
            dev_tools/map_generator/profiles/gwb_gameplay/unified_composition/semantic/pass30_extension_stairwells.csv
